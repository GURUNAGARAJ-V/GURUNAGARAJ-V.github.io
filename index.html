<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Inspired SHM Circuit Architecture</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
       .diagram-container {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

       .block {
            padding: 20px;
            text-align: center;
            border: 2px solid #333;
            border-radius: 8px;
            width: 160px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Specific block styling */
       .concrete { background-color: #cfd8dc; border-color: #455a64; }
       .afe { background-color: #ffcc80; border-color: #e65100; }
       .mcu { background-color: #a5d6a7; border-color: #1b5e20; }
       .lora { background-color: #90caf9; border-color: #0d47a1; }

       .block strong {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #222;
        }

       .block small {
            font-size: 12px;
            color: #555;
        }

        /* Connecting lines */
       .connector {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 80px;
            position: relative;
        }

       .line {
            width: 100%;
            height: 2px;
            background-color: #333;
            position: relative;
            margin: 10px 0;
        }

       .line::after {
            content: '';
            position: absolute;
            right: 0;
            top: -4px;
            border-left: 8px solid #333;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        /* Connection Labels */
       .label {
            font-size: 11px;
            font-weight: bold;
            color: #333;
            background: #fff;
            padding: 2px 4px;
            position: absolute;
            top: -10px;
        }

        /* Outer Probes for Concrete */
       .outer-probes {
            position: absolute;
            left: -40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80%;
            top: 10%;
        }

       .probe-line {
            width: 30px;
            height: 2px;
            background-color: #333;
            position: relative;
        }

       .probe-label {
            position: absolute;
            left: -20px;
            top: -8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* RF Antenna */
       .antenna-container {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

       .antenna-pole {
            width: 2px;
            height: 20px;
            background: #333;
        }

       .antenna-dish {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 20px solid #0d47a1;
        }
    </style>
</head>
<body>

    <div class="diagram-container">
        
        <div class="block concrete">
            <div class="outer-probes">
                <div class="probe-line"><span class="probe-label">I+</span></div>
                <div class="probe-line"><span class="probe-label">I-</span></div>
            </div>
            <strong>Self-Sensing Concrete</strong>
            <small>(R_c |

| C_c)</small>
        </div>

        <div class="connector">
            <div class="line"><span class="label" style="top: -15px;">V+ / V-</span></div>
            <small style="font-size: 9px; text-align: center; margin-top: 5px;">Kelvin Connection</small>
        </div>

        <div class="block afe">
            <strong>AD5933</strong>
            <small>High-Precision Impedance Analyzer</small>
        </div>

        <div class="connector">
            <div class="line"><span class="label" style="top: -15px;">SDA</span></div>
            <div class="line"><span class="label" style="top: 5px;">SCL</span></div>
            <small style="font-size: 9px; text-align: center; margin-top: 5px;">I2C Bus</small>
        </div>

        <div class="block mcu">
            <strong>ARM Cortex-M</strong>
            <small>w/ Neural Processing Unit (Edge AI)</small>
        </div>

        <div class="connector">
            <div class="line"><span class="label" style="top: -15px;">UART</span></div>
            <small style="font-size: 9px; text-align: center; margin-top: 5px;">Serial</small>
        </div>

        <div class="block lora">
            <div class="antenna-container">
                <div class="antenna-dish"></div>
                <div class="antenna-pole"></div>
            </div>
            <strong>LoRaWAN</strong>
            <small>Transceiver Node</small>
        </div>

    </div>

</body>
</html>
