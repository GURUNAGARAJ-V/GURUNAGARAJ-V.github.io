    <style>
        /* ======================================================== */
        /* SVG LIQUID GLASS ENGINE (REFRACTIVE)                     */
        /* ======================================================== */
        :root {
            --bg-base: #f0f4f8; 
            --text-main: #0f172a;
            --text-muted: #475569;
            
            /* Glass Styling */
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-inner-bg: rgba(255, 255, 255, 0.45);
            --glass-border-top: rgba(255, 255, 255, 0.9);
            --glass-border-left: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.08), inset 0 2px 4px rgba(255, 255, 255, 1);
            
            /* Ambient Orbs */
            --orb-1: rgba(52, 211, 153, 0.5); /* Emerald */
            --orb-2: rgba(56, 189, 248, 0.4); /* Sky Blue */
            --orb-3: rgba(251, 146, 60, 0.3); /* Orange */
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .text-main { color: var(--text-main) !important; }
        .text-muted { color: var(--text-muted) !important; }
        .bg-inner { background-color: var(--glass-inner-bg) !important; }

        /* Solid Black Numbers */
        .odometer .odometer-digit {
            color: #000000 !important; 
            font-weight: 500 !important;
            -webkit-text-stroke: 0 !important;
            text-shadow: none !important;
        }

        /* ----------------------------------------- */
        /* SVG LIQUID GLASS DEFINITIONS              */
        /* ----------------------------------------- */
        .liquid-glass {
            background: var(--glass-bg);
            /* Standard CSS Blur as a fallback */
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            /* The SVG Displacement Filter */
            backdrop-filter: url(#frosted);
            -webkit-backdrop-filter: url(#frosted);
            
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-left);
            box-shadow: var(--glass-shadow);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10;
        }

        .liquid-btn {
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: url(#frosted);
            -webkit-backdrop-filter: url(#frosted);
            border: 1px solid transparent;
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-left);
            box-shadow: 0 8px 15px -5px rgba(0,0,0,0.1), inset 0 2px 5px rgba(255,255,255,0.8);
            color: var(--text-main);
            padding: 0.8rem 1.8rem;
            border-radius: 9999px; 
            font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 50;
        }
        .liquid-btn:hover {
            background: rgba(255, 255, 255, 0.8); transform: translateY(-2px);
        }
        
        .liquid-input {
            background: rgba(255, 255, 255, 0.6); 
            border: 1px solid transparent; border-top-color: var(--glass-border-top);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05), 0 2px 5px rgba(255,255,255,0.8);
            color: var(--text-main); border-radius: 9999px; padding: 0.8rem 1.5rem; outline: none; transition: all 0.3s ease;
        }

        .liquid-tile {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: url(#frosted);
            -webkit-backdrop-filter: url(#frosted);
            border: 1px solid transparent; border-top-color: var(--glass-border-top); border-left-color: var(--glass-border-left);
            box-shadow: var(--glass-shadow); padding: 1.5rem; border-radius: 1.5rem; cursor: pointer; transition: all 0.3s ease;
            color: var(--text-main); font-weight: 500; position: relative; overflow: hidden;
        }
        .liquid-tile:hover { background: rgba(255, 255, 255, 0.6); transform: translateY(-4px); }
        .liquid-tile.correct { background: rgba(16,185,129,0.3) !important; border-color: rgba(16,185,129,0.8) !important; }
        .liquid-tile.wrong { background: rgba(239,68,68,0.3) !important; border-color: rgba(239,68,68,0.8) !important; }

        /* Profile Glass Ring */
        .profile-glass-ring {
            position: absolute; inset: 0; border-radius: 9999px; z-index: 10; pointer-events: none;
            box-shadow: inset 0 0 0 15px rgba(255,255,255,0.4), inset 0 0 20px 15px rgba(255,255,255,0.8);
            backdrop-filter: url(#frosted);
            -webkit-mask-image: radial-gradient(circle, transparent 55%, black 100%);
            mask-image: radial-gradient(circle, transparent 55%, black 100%);
        }

        /* HYPER-CINEMATIC INTRO LAYER               */

            transition: opacity 1.5s ease-in-out; overflow: hidden;
        }
